name: Cycle 60 synthetic dimensional metrology
on:
  push:
    paths:
      - 'benchmarks/cycle60_metrology.py'
      - 'tests/test_cycle60_metrology.py'
      - '.github/workflows/cycle60-metrology.yml'
  pull_request:
    paths:
      - 'benchmarks/cycle60_metrology.py'
      - 'tests/test_cycle60_metrology.py'
      - '.github/workflows/cycle60-metrology.yml'
permissions:
  contents: read
jobs:
  offline-dimensional-regression:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run isolated synthetic regression C60 only (not expert validation)
        run: python -m unittest tests.test_cycle60_metrology -v
