name: Cycle 55 permanent Pages receipt custody and human-review boundaries

on:
  push:
    paths:
      - 'archives/pages/**'
      - 'governance/cycle55_evidence_custody.py'
      - 'scripts/import_pages_evidence.py'
      - 'tests/test_cycle55_evidence_custody.py'
      - 'contracts/pages-evidence-custody.schema.json'
      - 'contracts/cycle55-custody-audit.schema.json'
      - 'docs/CUSTODIA_EVIDENCIAS_PAGES_55.md'
      - '.github/workflows/cycle55-evidence-custody.yml'
  pull_request:
    paths:
      - 'archives/pages/**'
      - 'governance/cycle55_evidence_custody.py'
      - 'scripts/import_pages_evidence.py'
      - 'tests/test_cycle55_evidence_custody.py'
      - 'contracts/pages-evidence-custody.schema.json'
      - 'contracts/cycle55-custody-audit.schema.json'
      - 'docs/CUSTODIA_EVIDENCIAS_PAGES_55.md'
      - '.github/workflows/cycle55-evidence-custody.yml'

permissions:
  contents: read

jobs:
  verify-immutable-public-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned schema checker
        run: python -m pip install --disable-pip-version-check --no-input jsonschema==4.23.0
      - name: Check original JSON SHA256 and source run links
        run: |
          python -m compileall -q governance/cycle55_evidence_custody.py scripts/import_pages_evidence.py tests/test_cycle55_evidence_custody.py
          python -m governance.cycle55_evidence_custody --output build/governance/cycle55-custody.json
          python -m unittest tests.test_cycle54_pages_release_gate tests.test_cycle55_evidence_custody -v
      - name: Validate custody and no-GO schemas
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator
          pairs=[
           ("contracts/pages-evidence-custody.schema.json",
            "archives/pages/2026-11-07-run-42412015125/custody-manifest.v1.json"),
           ("contracts/cycle55-custody-audit.schema.json",
            "build/governance/cycle55-custody.json"),
           ("contracts/pages-release-candidate.schema.json",
            "archives/pages/2026-11-07-run-42412015125/pages-release-candidate.json"),
           ("contracts/pages-http-receipt.schema.json",
            "archives/pages/2026-11-07-run-42412015125/pages-http-receipt.json")
          ]
          for a,b in pairs:
              schema=json.loads(Path(a).read_text(encoding="utf-8"))
              evidence=json.loads(Path(b).read_text(encoding="utf-8"))
              Draft202012Validator.check_schema(schema)
              Draft202012Validator(schema).validate(evidence)
          report=json.loads(Path("build/governance/cycle55-custody.json").read_text(encoding="utf-8"))
          assert report["verifiedOriginalJsonFiles"]==2
          assert report["sourceZipArchiveRetained"] is True
          assert report["sourceZipSha256Matched"] is True
          assert report["humanReviewCompleted"] is False
          assert report["operationalAuthorityGranted"] is False
          print("PASS: original public receipts preserved, no GO or human validation")
          PY
      - name: Upload non-sensitive custody verification report
        uses: actions/upload-artifact@v4
        with:
          name: cycle55-public-custody-audit
          path: build/governance/cycle55-custody.json
          retention-days: 14
