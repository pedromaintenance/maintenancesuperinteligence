name: Cycle 65 synthetic conflict review ledger
on:
  push:
    paths:
      - 'benchmarks/cycle65_review_ledger.py'
      - 'benchmarks/cycle64_source_governance.py'
      - 'tests/test_cycle64_source_governance.py'
      - 'tests/test_cycle65_review_ledger.py'
      - '.github/workflows/cycle65-review-ledger.yml'
  pull_request:
    paths:
      - 'benchmarks/cycle65_review_ledger.py'
      - 'benchmarks/cycle64_source_governance.py'
      - 'tests/test_cycle64_source_governance.py'
      - 'tests/test_cycle65_review_ledger.py'
      - '.github/workflows/cycle65-review-ledger.yml'
permissions:
  contents: read
jobs:
  offline-review-ledger:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run synthetic C58-C65 gates; no human identity or technical approval
        run: python -m unittest tests.test_cycle58_causal_gate tests.test_cycle59_observation_consistency tests.test_cycle60_metrology tests.test_cycle61_metrology_context tests.test_cycle62_reference_semantics tests.test_cycle63_effectivity tests.test_cycle64_source_governance tests.test_cycle65_review_ledger -v
