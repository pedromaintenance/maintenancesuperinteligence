name: Validate maintenance research and synthetic architecture review dossier

on:
  push:
  pull_request:

jobs:
  knowledge-and-fmea:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate existing knowledge metadata
        run: python scripts/validate.py
      - name: Compile Python sources
        run: python -m compileall -q connectors scripts tests
      - name: Run offline adversarial tests
        run: python -m unittest discover -s tests -v
      - name: Import pinned FMEA public snapshot
        run: python connectors/fmea_public.py --fetch --output build/fmea-public
      - name: Check public import receipt without promoting evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          receipt = json.loads(Path("build/fmea-public/import-receipt.json").read_text())
          index = json.loads(Path("build/fmea-public/fmea-public.index.json").read_text())
          assert receipt["recordsAccepted"] == 24
          assert receipt["sourcesAccepted"] == 20
          assert receipt["confirmedRootCauses"] == 0
          assert receipt["empiricalOccurrences"] == 0
          assert receipt["operationalApproval"] is False
          assert index["approvedForOperationalUse"] is False
          assert all(rec["approvedForOperationalUse"] is False for rec in index["records"])
          assert all(not rec["confirmedRootCause"] for rec in index["records"])
          assert all(test["status"] == "not_performed"
                     for rec in index["records"] for test in rec["plannedInvestigations"])
          print("PASS: 24 public inferred records; zero promotion to evidence or operational authority")
          PY
      - name: Run educational CAT 777E differential scenarios
        run: |
          mkdir -p build/investigations
          for path in examples/777e_additives_only.json examples/777e_change_documented.json examples/777e_water_disputed.json examples/777e_debris_and_noise.json; do
            name=$(basename "$path" .json)
            python -m investigations.final_drive \
              --snapshot build/fmea-public/fmea-public.snapshot.json \
              --index build/fmea-public/fmea-public.index.json \
              --case "$path" --output "build/investigations/$name.json" > /dev/null
          done
      - name: Verify all educational scenarios abstain from confirming faults
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          cases = sorted(Path("build/investigations").glob("*.json"))
          assert len(cases) == 4, f"Expected 4 pilots, got {len(cases)}"
          for path in cases:
              result = json.loads(path.read_text())
              assert result["humanReviewRequired"] is True
              assert result["confirmedRootCause"] is None
              assert result["condemnedComponent"] is None
              assert result["mayReleaseEquipment"] is False
              assert result["mayCreateWorkOrder"] is False
              assert result["machineContext"]["oemApplicabilityVerified"] is False
              assert result["decision"] in ("needs_evidence", "escalate_to_specialist")
              assert len(result["hypotheses"]) == 7
              assert len(result["plannedInvestigations"]) == 8
              assert all(t["status"] == "not_performed" for t in result["plannedInvestigations"])
          by_name = {path.stem: json.loads(path.read_text()) for path in cases}
          assert by_name["777e_additives_only"]["decision"] == "needs_evidence"
          assert by_name["777e_change_documented"]["decision"] == "needs_evidence"
          assert by_name["777e_water_disputed"]["decision"] == "escalate_to_specialist"
          assert by_name["777e_debris_and_noise"]["decision"] == "escalate_to_specialist"
          print("PASS: four 777E didactic investigations, no confirmed defects or machine release")
          PY
      - name: Verify provenance and evidence ledgers from four pilots
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from evidence.ledger import validate_ledger
          paths = sorted(Path("build/investigations").glob("*.json"))
          assert len(paths) == 4
          for path in paths:
              report = json.loads(path.read_text())
              assert report["schema"] == "maintenance-superinteligence.final-drive-investigation.v2"
              ledger = report["evidenceLedger"]
              case = json.loads((Path("examples") / path.name).read_text())
              validate_ledger(ledger, case=case, investigation=report)
              assert len(ledger["testMethods"]) == 8
              assert ledger["testResults"] == []
              assert len(ledger["auditTrail"]) == 6
              assert all(x["confidence"] is None and not x["rootCauseConfirmed"]
                         for x in ledger["hypothesisAssessments"])
              assert ledger["humanReview"]["status"] == "pending"
              assert not ledger["humanReview"]["operationalReleaseAuthorized"]
          print("PASS: validated evidence provenance and six chained audit events per scenario")
          PY
      - name: Generate eight source-linked CAT 777E method checklists
        run: |
          mkdir -p build/methods
          for path in examples/777e_additives_only.json examples/777e_change_documented.json examples/777e_water_disputed.json examples/777e_debris_and_noise.json; do
            name=$(basename "$path" .json)
            python -m methods.library \
              --snapshot build/fmea-public/fmea-public.snapshot.json \
              --case "$path" \
              --investigation "build/investigations/$name.json" \
              --output "build/methods/$name.methods.json" > /dev/null
          done
      - name: Assert method coverage, FMEA lineage and absence of OEM approval
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          plans = list(Path("build/methods").glob("*.methods.json"))
          assert len(plans) == 4
          for path in plans:
              p = json.loads(path.read_text())
              assert p["methodsCataloged"] == 14
              assert p["fmeaMethodsLinked"] == 6
              assert p["fmeaInvestigationsLinked"] == 8
              assert p["coverage"] == {"oil": 4, "hydraulics": 3, "mechanics": 3,
                                        "vibration": 2, "electronics": 2}
              assert p["mayExecuteTests"] is False
              assert p["approvedForOperationalUse"] is False
              assert p["confirmedComponentFailure"] is None
              assert all(m["executionStatus"] == "proposed_not_executed"
                         and m["oemApplicability"] == "not_verified"
                         and not m["mayExecuteAutomatically"]
                         and m["requiredContextQuestions"]
                         and m["expectedObservationFields"]
                         and all(o["status"] == "not_measured" for o in m["expectedObservationFields"])
                         for m in p["suggestedQuestions"])
          print("PASS: method catalogue, eight FMEA references, zero invented OEM authority")
          PY
      - name: Reject forged investigation in method planning
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          src = Path("build/investigations/777e_additives_only.json")
          report = json.loads(src.read_text())
          report["plannedInvestigations"][0]["purposeFromSource"] = "AUTO-APPROVED OEM"
          Path("build/investigations/forged-method-input.json").write_text(json.dumps(report))
          PY
          if python -m methods.library \
            --snapshot build/fmea-public/fmea-public.snapshot.json \
            --case examples/777e_additives_only.json \
            --investigation build/investigations/forged-method-input.json > /dev/null 2>&1; then
              echo "SECURITY FAIL: forged investigation method accepted"
              exit 1
          fi
          rm build/investigations/forged-method-input.json
      - name: Publish conceptual methods and checklist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-methods-777e-training-checklists
          path: build/methods/
          retention-days: 14
      - name: Verify explicit simulated test is separate from executed OEM test
        run: |
          python -m investigations.final_drive \
            --snapshot build/fmea-public/fmea-public.snapshot.json \
            --index build/fmea-public/fmea-public.index.json \
            --case examples/777e_water_disputed.json \
            --simulated-test-results examples/777e_simulated_test_results.json \
            --output build/investigations/supplementary_simulation.json > /dev/null
          python - <<'PY'
          import json
          from pathlib import Path
          from evidence.ledger import validate_ledger
          report = json.loads(Path("build/investigations/supplementary_simulation.json").read_text())
          case = json.loads(Path("examples/777e_water_disputed.json").read_text())
          ledger = report["evidenceLedger"]
          validate_ledger(ledger, case=case, investigation=report)
          assert len(ledger["testResults"]) == 1
          assert ledger["testResults"][0]["status"] == "simulated_execution"
          assert all(t["status"] == "proposed_not_executed" for t in ledger["testMethods"])
          assert report["confirmedRootCause"] is None and report["mayReleaseEquipment"] is False
          print("PASS: synthetic test result cannot promote source method or authorize field repair")
          PY
      - name: Reject manipulated consumer index even with valid snapshot
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("build/fmea-public/fmea-public.index.json")
          data = json.loads(p.read_text())
          data["records"][0]["title"] = "FAKE - altered locally"
          Path("build/fmea-public/forged-index.json").write_text(json.dumps(data))
          PY
          if python -m investigations.final_drive \
              --snapshot build/fmea-public/fmea-public.snapshot.json \
              --index build/fmea-public/forged-index.json \
              --case examples/777e_additives_only.json > /dev/null 2>&1; then
            echo "SECURITY FAIL: forged index accepted"
            exit 1
          fi
      - name: Publish educational pilot results
        uses: actions/upload-artifact@v4
        with:
          name: final-drive-777e-didactic-investigations
          path: build/investigations/
          retention-days: 14
      - name: Select next research questions for three synthetic domains
        run: |
          mkdir -p build/discrimination
          for key in 777e hydraulics electronics; do
            python -m methods.discrimination \
              --snapshot build/fmea-public/fmea-public.snapshot.json \
              --case "examples/discrimination_$key.json" \
              --output "build/discrimination/$key.selection.json" > /dev/null
          done
      - name: Verify discrimination, abstention and deterministic rationale
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          results = {x.name.split(".")[0]: json.loads(x.read_text())
                     for x in Path("build/discrimination").glob("*.selection.json")}
          assert set(results) == {"777e", "hydraulics", "electronics"}
          assert results["777e"]["familyId"] == "final_drive"
          assert len(results["777e"]["hypotheses"]) == 7
          assert len(results["777e"]["comparisons"]) == 4
          assert results["hydraulics"]["selectionRationale"]["selectionStatus"] == "reconcile_contradiction"
          assert results["hydraulics"]["selectionRationale"]["selectedPairId"] == "HYD-P01"
          assert results["electronics"]["reportedSignalsAreMeasurements"] is False
          for key, result in results.items():
              assert result["fmeaVerifiedBySnapshot"] is True
              assert all(h["status"] == "open_not_confirmed"
                         and h["confirmedRootCause"] is False
                         for h in result["hypotheses"])
              assert all(c["observedOutcome"] is None and c["bothRemainOpen"]
                         for c in result["comparisons"])
              assert all(x["executionStatus"] == "proposed_not_executed"
                         and x["oemApplicability"] == "not_verified"
                         and x["status"] == "question_only"
                         and not x["mayExecute"] for x in result["candidateQuestions"])
              assert result["mayRunTests"] is False
              assert result["mayModifyECM"] is False
              assert result["mayCreateWorkOrder"] is False
              assert result["mayReleaseEquipment"] is False
              assert result["confirmedComponent"] is None
              assert result["selectionRationale"]["noInformationGainOrCostScores"] is True
          print("PASS: didactic discrimination only; no diagnosis, OEM claims, or work authorization")
          PY
      - name: Reject forged confirmed causal pattern
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          src = Path("methods/discrimination-matrix.v1.json")
          data = json.loads(src.read_text())
          data["families"][0]["pairs"][0]["hasObservedOutcome"] = True
          Path("build/discrimination/forged-matrix.json").write_text(json.dumps(data))
          PY
          if python -m methods.discrimination \
               --snapshot build/fmea-public/fmea-public.snapshot.json \
               --case examples/discrimination_777e.json \
               --matrix build/discrimination/forged-matrix.json > /dev/null 2>&1; then
             echo "SECURITY FAIL: false observed outcome accepted"
             exit 1
          fi
          rm build/discrimination/forged-matrix.json
      - name: Publish didactic differential planning artifacts
        uses: actions/upload-artifact@v4
        with:
          name: discrimination-three-training-domains
          path: build/discrimination/
          retention-days: 14
      - name: Run locked-source synthetic question benchmark
        run: |
          mkdir -p build/benchmarks
          python -m benchmarks.quality \
            --snapshot build/fmea-public/fmea-public.snapshot.json \
            --output build/benchmarks/question-quality.v1.report.json > /dev/null
      - name: Assert regression categories and explicitly non-empirical metrics
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path("build/benchmarks/question-quality.v1.report.json").read_text())
          assert r["schema"] == "maintenance-superinteligence.question-benchmark-report.v1"
          assert r["fixturesEvaluated"] == 15 and r["fixturesPassed"] == 15
          assert r["acceptance"] == "regression_pass"
          assert r["syntheticAbstentionRate"] == {"abstained": 15, "total": 15}
          assert r["canonicalReproducibility"] == {"passed": 15, "total": 15}
          assert r["diagnosticAccuracyMeasured"] is False
          assert r["technicalExpertReviewComplete"] is False
          assert r["operationalValidation"] is False
          assert r["benchmarkNature"] == "synthetic_regression_not_diagnostic_accuracy"
          expected_classes = {"provenance", "ambiguity", "contradiction",
            "hypothesis_promotion", "safety", "effectivity", "prerequisite",
            "selection", "reproducibility"}
          assert set(r["checkComplianceByCategory"]) == expected_classes
          for category, checks in r["checkComplianceByCategory"].items():
              assert checks["passed"] == checks["total"] and checks["total"] > 0
              assert r["failureCountsByClass"][category] == 0
          assert all(x["passes"] and not x["failureClasses"] for x in r["cases"])
          assert len({x["outputDigestSha256"] for x in r["cases"]}) == 15
          print("PASS: 15 authored synthetic regressions; zero authority promotion")
          PY
      - name: Reject benchmark with fabricated approval as safety gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("benchmarks/question-quality.v1.json")
          manifest = json.loads(p.read_text())
          manifest["reviewStatus"] = "expert_validated"
          Path("build/benchmarks/forged-benchmark.json").write_text(json.dumps(manifest))
          PY
          if python -m benchmarks.quality \
             --snapshot build/fmea-public/fmea-public.snapshot.json \
             --manifest build/benchmarks/forged-benchmark.json > /dev/null 2>&1; then
            echo "SECURITY FAIL: falsely approved benchmark accepted"
            exit 1
          fi
          rm build/benchmarks/forged-benchmark.json
      - name: Ensure intentionally incorrect golden label produces failing regression
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          src = Path("benchmarks/question-quality.v1.json")
          m = json.loads(src.read_text())
          m["fixtures"][0]["expected"]["nextQuestionContains"] = "UNOBSERVED-EXPERT-CONCLUSION"
          Path("build/benchmarks/poisoned-golden.json").write_text(json.dumps(m))
          PY
          if python -m benchmarks.quality \
             --snapshot build/fmea-public/fmea-public.snapshot.json \
             --manifest build/benchmarks/poisoned-golden.json \
             --output build/benchmarks/poisoned-result.json > /dev/null 2>&1; then
            echo "REGRESSION FAIL: poisoned golden label was accepted"
            exit 1
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path("build/benchmarks/poisoned-result.json").read_text())
          assert r["acceptance"] == "regression_fail"
          assert r["failureCountsByClass"]["selection"] > 0
          assert r["fixturesPassed"] == 14
          print("PASS: failed semantic selection is counted, not mistaken for diagnostic accuracy")
          PY
          rm build/benchmarks/poisoned-golden.json build/benchmarks/poisoned-result.json
      - name: Publish synthetic regression benchmark report
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-question-regression-benchmark
          path: build/benchmarks/question-quality.v1.report.json
          retention-days: 14
      - name: Validate synthetic technical claims and reviewer workflow
        run: |
          mkdir -p build/governance
          python -m governance.review \
            --snapshot build/fmea-public/fmea-public.snapshot.json \
            --output build/governance/technical-review.v1.report.json > /dev/null
      - name: Verify source links, derived statuses, fictional personas, and no OEM approval
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("build/governance/technical-review.v1.report.json").read_text())
          assert report["reviewMode"] == "synthetic_only"
          assert report["claimsEvaluated"] == 8
          assert report["citationsLinked"] == 9
          assert report["fictionalAssessments"] == 13
          assert report["statusCounts"] == {
              "draft": 1, "needs_evidence": 2, "under_review": 1,
              "disputed": 2, "general_reference_supported": 2,
              "oem_series_verified": 0}
          assert len(report["disagreements"]) == 2
          assert all(d["requiresRealTechnicalReview"]
                     and not d["reviewerIdentityVerified"]
                     and not d["reviewerIndependenceVerified"]
                     and not d["oemSeriesVerified"]
                     and not d["approvedForOperationalUse"]
                     and not d["rootCauseConfirmed"]
                     for d in report["decisions"])
          assert not report["hasAuthenticatedExpertReviews"]
          assert not report["discriminationScientificallyValidated"]
          assert not report["mayAuthorizeWork"]
          assert not report["mayCreateWorkOrder"]
          assert not report["mayReleaseEquipment"]
          print("PASS: 8 editorial claims with provenance and zero real technical approvals")
          PY
      - name: Check question benchmark review qualification gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("build/benchmarks/question-quality.v1.report.json").read_text())
          gate = report["technicalReviewGate"]
          assert gate["claimsWithTraceability"] == 8
          assert gate["editoriallySupportedWithTwoFictionalPersonas"] == 2
          assert gate["unresolvedSyntheticDisagreements"] == 2
          assert gate["status"] == "blocked_pending_independent_real_expert_review"
          assert not gate["realReviewerIdentityAuthenticated"]
          assert not gate["realReviewerIndependenceVerified"]
          assert not gate["oemSeriesEffectivityVerified"]
          assert not gate["mayClaimFieldDiagnosticValidity"]
          print("PASS: synthetic software benchmark not mistaken for independently verified diagnostic accuracy")
          PY
      - name: Reject counterfeit signed expert review in synthetic packet
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path("governance/review-packet.v1.json").read_text())
          p["reviewers"][0]["credentialsVerified"] = True
          Path("build/governance/fake-credentials.json").write_text(json.dumps(p))
          PY
          if python -m governance.review \
              --snapshot build/fmea-public/fmea-public.snapshot.json \
              --packet build/governance/fake-credentials.json > /dev/null 2>&1; then
            echo "SECURITY FAIL: unverified reviewer credentials promoted to real technical approval"
            exit 1
          fi
          rm build/governance/fake-credentials.json
      - name: Publish synthetic governance decision report
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-technical-review-and-disagreement-report
          path: build/governance/technical-review.v1.report.json
          retention-days: 14
      - name: Run offline restricted-review security blueprint
        run: |
          mkdir -p build/restricted-review
          python -m governance.restricted_blueprint \
            --snapshot build/fmea-public/fmea-public.snapshot.json \
            --output build/restricted-review/threat-fixture.report.json > /dev/null
      - name: Assert roles, source lineage and absence of real authentication
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("build/restricted-review/threat-fixture.report.json").read_text())
          assert data["schema"] == "maintenance-superinteligence.restricted-review-simulation-report.v1"
          assert data["mode"] == "OFFLINE_SIMULATION_NOT_AUTHENTICATION"
          assert data["caseCount"] == 3
          assert data["eventCount"] == 9
          assert data["derivedStates"] == {
              "needs_evidence": 1, "qualified_general_claim_simulation": 1,
              "under_review": 1}
          assert data["authenticatedIdentityCount"] == 0
          assert data["verifiedReviewSignatureCount"] == 0
          assert data["qualifiedClaimsForRealWorldUse"] == 0
          assert data["reviewAuthenticity"] == "not_achieved"
          assert all(not data[k] for k in (
            "externalAuditAnchorConfigured", "trustedClockConfigured",
            "oemEffectivityVerified", "canWriteSap", "canModifyEcm",
            "canApproveMaintenance", "canReleaseEquipment"))
          assert all(not x["mayAuthorizeMaintenance"] and not x["mayVerifyOemSeries"]
                     and not x["mayPublishGeneralClaimAsReal"]
                     and not x["externalAnchorVerified"] and x["validReviewSignatures"] == 0
                     for x in data["cases"])
          print("PASS: three synthetic review sequences, no real identity or OEM qualification")
          PY
      - name: Detect forged offline review event after resealing
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from connectors.fmea_public import ImportRejected, load_lock, validate_snapshot
          from governance.restricted_blueprint import verify_report
          from methods.discrimination import validate_matrix
          from methods.library import validate_catalog, validate_sources
          root = Path(".")
          snapshot = validate_snapshot(Path("build/fmea-public/fmea-public.snapshot.json").read_bytes(),
                                       load_lock())
          src = validate_sources(json.loads(Path("data/diagnostic-method-sources.v1.json").read_text()))
          methods = validate_catalog(json.loads(Path("methods/catalog.v1.json").read_text()), src, snapshot)
          families = validate_matrix(json.loads(Path("methods/discrimination-matrix.v1.json").read_text()),
                                     methods, snapshot)
          fixture = json.loads(Path("examples/restricted-review-threat-fixture.v1.json").read_text())
          packet = json.loads(Path("governance/review-packet.v1.json").read_text())
          report = json.loads(Path("build/restricted-review/threat-fixture.report.json").read_text())
          report["cases"][0]["auditEvents"][1]["stateAfter"] = "oem_series_verified"
          try:
              verify_report(report, fixture, packet, methods, src, families, snapshot)
          except ImportRejected:
              print("PASS: forged promoted approval differs from source-derived chain")
          else:
              raise AssertionError("SECURITY FAIL: forged OEM promotion passed audit check")
          PY
      - name: Reject replayed nonce before deriving review state
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          f = json.loads(Path("examples/restricted-review-threat-fixture.v1.json").read_text())
          f["cases"][1]["events"][0]["nonce"] = f["cases"][0]["events"][0]["nonce"]
          Path("build/restricted-review/replayed-input.json").write_text(json.dumps(f))
          PY
          if python -m governance.restricted_blueprint \
             --snapshot build/fmea-public/fmea-public.snapshot.json \
             --fixture build/restricted-review/replayed-input.json > /dev/null 2>&1; then
            echo "SECURITY FAIL: replayed nonce accepted"
            exit 1
          fi
          rm build/restricted-review/replayed-input.json
      - name: Publish offline trust-boundary audit artifacts
        uses: actions/upload-artifact@v4
        with:
          name: offline-restricted-review-threat-simulation
          path: build/restricted-review/threat-fixture.report.json
          retention-days: 14
      - name: Validate synthetic private-integration contracts
        run: |
          mkdir -p build/integration
          python -m governance.integration_contracts \
            --policy governance/integration-policy.v1.json \
            --fixture examples/integration-fixture.v1.json \
            --output build/integration/contracts.report.json > /dev/null
      - name: Assert eight contracts, source proof gaps and deny-all outcome
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          contract_names = [
            "authenticated-principal", "credential-assertion", "technical-qualification",
            "claim-version", "independent-review-decision", "evidence-manifest",
            "audit-anchor", "oem-effectivity-attestation"]
          for name in contract_names:
              schema = json.loads(Path("contracts", name+".schema.json").read_text())
              assert schema["type"] == "object" and schema["additionalProperties"] is False
              assert schema["required"]
          p = json.loads(Path("build/integration/contracts.report.json").read_text())
          assert p["principalCount"] == 8
          assert len(set(p["fictionalReviewerIds"])) == 2
          assert p["reviewStatus"] == "disputed_simulation"
          assert p["approval"] == "blocked_missing_private_verified_trust"
          assert len(p["requiredPrivateProofs"]) == 10
          assert all(x["status"] == "not_implemented" for x in p["requiredPrivateProofs"])
          assert p["credentialChecksAuthenticated"] == 0
          assert p["reviewSignaturesVerified"] == 0
          assert p["allowedPublicOperations"] == []
          assert all(p[k] is False for k in [
            "auditAnchorVerified", "oemSeriesApproved", "claimRevisionExternallySealed",
            "realEvidenceProcessed", "independentlyReviewedByHumans",
            "mayQualifyRealKnowledge", "mayOpenWorkOrder", "mayChangeEquipment"])
