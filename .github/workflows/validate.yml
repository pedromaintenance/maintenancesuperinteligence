name: Validate public knowledge, investigation and methods

on:
  push:
  pull_request:

jobs:
  knowledge-and-fmea:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate existing knowledge metadata
        run: python scripts/validate.py
      - name: Compile Python sources
        run: python -m compileall -q connectors scripts tests
      - name: Run offline adversarial tests
        run: python -m unittest discover -s tests -v
      - name: Import pinned FMEA public snapshot
        run: python connectors/fmea_public.py --fetch --output build/fmea-public
      - name: Check public import receipt without promoting evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          receipt = json.loads(Path("build/fmea-public/import-receipt.json").read_text())
          index = json.loads(Path("build/fmea-public/fmea-public.index.json").read_text())
          assert receipt["recordsAccepted"] == 24
          assert receipt["sourcesAccepted"] == 20
          assert receipt["confirmedRootCauses"] == 0
          assert receipt["empiricalOccurrences"] == 0
          assert receipt["operationalApproval"] is False
          assert index["approvedForOperationalUse"] is False
          assert all(rec["approvedForOperationalUse"] is False for rec in index["records"])
          assert all(not rec["confirmedRootCause"] for rec in index["records"])
          assert all(test["status"] == "not_performed"
                     for rec in index["records"] for test in rec["plannedInvestigations"])
          print("PASS: 24 public inferred records; zero promotion to evidence or operational authority")
          PY
      - name: Run educational CAT 777E differential scenarios
        run: |
          mkdir -p build/investigations
          for path in examples/777e_additives_only.json examples/777e_change_documented.json examples/777e_water_disputed.json examples/777e_debris_and_noise.json; do
            name=$(basename "$path" .json)
            python -m investigations.final_drive \
              --snapshot build/fmea-public/fmea-public.snapshot.json \
              --index build/fmea-public/fmea-public.index.json \
              --case "$path" --output "build/investigations/$name.json" > /dev/null
          done
      - name: Verify all educational scenarios abstain from confirming faults
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          cases = sorted(Path("build/investigations").glob("*.json"))
          assert len(cases) == 4, f"Expected 4 pilots, got {len(cases)}"
          for path in cases:
              result = json.loads(path.read_text())
              assert result["humanReviewRequired"] is True
              assert result["confirmedRootCause"] is None
              assert result["condemnedComponent"] is None
              assert result["mayReleaseEquipment"] is False
              assert result["mayCreateWorkOrder"] is False
              assert result["machineContext"]["oemApplicabilityVerified"] is False
              assert result["decision"] in ("needs_evidence", "escalate_to_specialist")
              assert len(result["hypotheses"]) == 7
              assert len(result["plannedInvestigations"]) == 8
              assert all(t["status"] == "not_performed" for t in result["plannedInvestigations"])
          by_name = {path.stem: json.loads(path.read_text()) for path in cases}
          assert by_name["777e_additives_only"]["decision"] == "needs_evidence"
          assert by_name["777e_change_documented"]["decision"] == "needs_evidence"
          assert by_name["777e_water_disputed"]["decision"] == "escalate_to_specialist"
          assert by_name["777e_debris_and_noise"]["decision"] == "escalate_to_specialist"
          print("PASS: four 777E didactic investigations, no confirmed defects or machine release")
          PY
      - name: Verify provenance and evidence ledgers from four pilots
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from evidence.ledger import validate_ledger
          paths = sorted(Path("build/investigations").glob("*.json"))
          assert len(paths) == 4
          for path in paths:
              report = json.loads(path.read_text())
              assert report["schema"] == "maintenance-superinteligence.final-drive-investigation.v2"
              ledger = report["evidenceLedger"]
              case = json.loads((Path("examples") / path.name).read_text())
              validate_ledger(ledger, case=case, investigation=report)
              assert len(ledger["testMethods"]) == 8
              assert ledger["testResults"] == []
              assert len(ledger["auditTrail"]) == 6
              assert all(x["confidence"] is None and not x["rootCauseConfirmed"]
                         for x in ledger["hypothesisAssessments"])
              assert ledger["humanReview"]["status"] == "pending"
              assert not ledger["humanReview"]["operationalReleaseAuthorized"]
          print("PASS: validated evidence provenance and six chained audit events per scenario")
          PY
      - name: Generate eight source-linked CAT 777E method checklists
        run: |
          mkdir -p build/methods
          for path in examples/777e_additives_only.json examples/777e_change_documented.json examples/777e_water_disputed.json examples/777e_debris_and_noise.json; do
            name=$(basename "$path" .json)
            python -m methods.library \
              --snapshot build/fmea-public/fmea-public.snapshot.json \
              --case "$path" \
              --investigation "build/investigations/$name.json" \
              --output "build/methods/$name.methods.json" > /dev/null
          done
      - name: Assert method coverage, FMEA lineage and absence of OEM approval
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          plans = list(Path("build/methods").glob("*.methods.json"))
          assert len(plans) == 4
          for path in plans:
              p = json.loads(path.read_text())
              assert p["methodsCataloged"] == 14
              assert p["fmeaMethodsLinked"] == 6
              assert p["fmeaInvestigationsLinked"] == 8
              assert p["coverage"] == {"oil": 4, "hydraulics": 3, "mechanics": 3,
                                        "vibration": 2, "electronics": 2}
              assert p["mayExecuteTests"] is False
              assert p["approvedForOperationalUse"] is False
              assert p["confirmedComponentFailure"] is None
              assert all(m["executionStatus"] == "proposed_not_executed"
                         and m["oemApplicability"] == "not_verified"
                         and not m["mayExecuteAutomatically"]
                         and m["requiredContextQuestions"]
                         and m["expectedObservationFields"]
                         and all(o["status"] == "not_measured" for o in m["expectedObservationFields"])
                         for m in p["suggestedQuestions"])
          print("PASS: method catalogue, eight FMEA references, zero invented OEM authority")
          PY
      - name: Reject forged investigation in method planning
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          src = Path("build/investigations/777e_additives_only.json")
          report = json.loads(src.read_text())
          report["plannedInvestigations"][0]["purposeFromSource"] = "AUTO-APPROVED OEM"
          Path("build/investigations/forged-method-input.json").write_text(json.dumps(report))
          PY
          if python -m methods.library \
            --snapshot build/fmea-public/fmea-public.snapshot.json \
            --case examples/777e_additives_only.json \
            --investigation build/investigations/forged-method-input.json > /dev/null 2>&1; then
              echo "SECURITY FAIL: forged investigation method accepted"
              exit 1
          fi
          rm build/investigations/forged-method-input.json
      - name: Publish conceptual methods and checklist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-methods-777e-training-checklists
          path: build/methods/
          retention-days: 14
      - name: Verify explicit simulated test is separate from executed OEM test
        run: |
          python -m investigations.final_drive \
            --snapshot build/fmea-public/fmea-public.snapshot.json \
            --index build/fmea-public/fmea-public.index.json \
            --case examples/777e_water_disputed.json \
            --simulated-test-results examples/777e_simulated_test_results.json \
            --output build/investigations/supplementary_simulation.json > /dev/null
          python - <<'PY'
          import json
          from pathlib import Path
          from evidence.ledger import validate_ledger
          report = json.loads(Path("build/investigations/supplementary_simulation.json").read_text())
          case = json.loads(Path("examples/777e_water_disputed.json").read_text())
          ledger = report["evidenceLedger"]
          validate_ledger(ledger, case=case, investigation=report)
          assert len(ledger["testResults"]) == 1
          assert ledger["testResults"][0]["status"] == "simulated_execution"
          assert all(t["status"] == "proposed_not_executed" for t in ledger["testMethods"])
          assert report["confirmedRootCause"] is None and report["mayReleaseEquipment"] is False
          print("PASS: synthetic test result cannot promote source method or authorize field repair")
          PY
      - name: Reject manipulated consumer index even with valid snapshot
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("build/fmea-public/fmea-public.index.json")
          data = json.loads(p.read_text())
          data["records"][0]["title"] = "FAKE - altered locally"
          Path("build/fmea-public/forged-index.json").write_text(json.dumps(data))
          PY
          if python -m investigations.final_drive \
              --snapshot build/fmea-public/fmea-public.snapshot.json \
              --index build/fmea-public/forged-index.json \
              --case examples/777e_additives_only.json > /dev/null 2>&1; then
            echo "SECURITY FAIL: forged index accepted"
            exit 1
          fi
      - name: Publish educational pilot results
        uses: actions/upload-artifact@v4
        with:
          name: final-drive-777e-didactic-investigations
          path: build/investigations/
          retention-days: 14
      - name: Select next research questions for three synthetic domains
        run: |
          mkdir -p build/discrimination
          for key in 777e hydraulics electronics; do
            python -m methods.discrimination \
              --snapshot build/fmea-public/fmea-public.snapshot.json \
              --case "examples/discrimination_$key.json" \
              --output "build/discrimination/$key.selection.json" > /dev/null
          done
      - name: Verify discrimination, abstention and deterministic rationale
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          results = {x.name.split(".")[0]: json.loads(x.read_text())
                     for x in Path("build/discrimination").glob("*.selection.json")}
          assert set(results) == {"777e", "hydraulics", "electronics"}
          assert results["777e"]["familyId"] == "final_drive"
          assert len(results["777e"]["hypotheses"]) == 7
          assert len(results["777e"]["comparisons"]) == 4
          assert results["hydraulics"]["selectionRationale"]["selectionStatus"] == "reconcile_contradiction"
          assert results["hydraulics"]["selectionRationale"]["selectedPairId"] == "HYD-P01"
          assert results["electronics"]["reportedSignalsAreMeasurements"] is False
          for key, result in results.items():
              assert result["fmeaVerifiedBySnapshot"] is True
              assert all(h["status"] == "open_not_confirmed"
                         and h["confirmedRootCause"] is False
                         for h in result["hypotheses"])
              assert all(c["observedOutcome"] is None and c["bothRemainOpen"]
                         for c in result["comparisons"])
              assert all(x["executionStatus"] == "proposed_not_executed"
                         and x["oemApplicability"] == "not_verified"
                         and x["status"] == "question_only"
                         and not x["mayExecute"] for x in result["candidateQuestions"])
              assert result["mayRunTests"] is False
              assert result["mayModifyECM"] is False
              assert result["mayCreateWorkOrder"] is False
              assert result["mayReleaseEquipment"] is False
              assert result["confirmedComponent"] is None
              assert result["selectionRationale"]["noInformationGainOrCostScores"] is True
          print("PASS: didactic discrimination only; no diagnosis, OEM claims, or work authorization")
          PY
      - name: Reject forged confirmed causal pattern
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          src = Path("methods/discrimination-matrix.v1.json")
          data = json.loads(src.read_text())
          data["families"][0]["pairs"][0]["hasObservedOutcome"] = True
          Path("build/discrimination/forged-matrix.json").write_text(json.dumps(data))
          PY
          if python -m methods.discrimination \
               --snapshot build/fmea-public/fmea-public.snapshot.json \
               --case examples/discrimination_777e.json \
               --matrix build/discrimination/forged-matrix.json > /dev/null 2>&1; then
             echo "SECURITY FAIL: false observed outcome accepted"
             exit 1
          fi
          rm build/discrimination/forged-matrix.json
      - name: Publish didactic differential planning artifacts
        uses: actions/upload-artifact@v4
        with:
          name: discrimination-three-training-domains
          path: build/discrimination/
          retention-days: 14
      - name: Publish non-operational index and import receipt
        uses: actions/upload-artifact@v4
        with:
          name: fmea-public-inferred-index
          path: build/fmea-public/
          retention-days: 14
