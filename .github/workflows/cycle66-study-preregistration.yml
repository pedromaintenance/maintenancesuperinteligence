name: Cycle 66 independent study preregistration rehearsal
on:
  push:
    paths:
      - 'benchmarks/cycle66_study_preregistration.py'
      - 'benchmarks/cycle65_review_ledger.py'
      - 'tests/test_cycle65_review_ledger.py'
      - 'tests/test_cycle66_study_preregistration.py'
      - '.github/workflows/cycle66-study-preregistration.yml'
  pull_request:
    paths:
      - 'benchmarks/cycle66_study_preregistration.py'
      - 'benchmarks/cycle65_review_ledger.py'
      - 'tests/test_cycle65_review_ledger.py'
      - 'tests/test_cycle66_study_preregistration.py'
      - '.github/workflows/cycle66-study-preregistration.yml'
permissions:
  contents: read
jobs:
  offline-preregistration:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Synthetic C58-C66 regressions (no real human study)
        run: python -m unittest tests.test_cycle58_causal_gate tests.test_cycle59_observation_consistency tests.test_cycle60_metrology tests.test_cycle61_metrology_context tests.test_cycle62_reference_semantics tests.test_cycle63_effectivity tests.test_cycle64_source_governance tests.test_cycle65_review_ledger tests.test_cycle66_study_preregistration -v
