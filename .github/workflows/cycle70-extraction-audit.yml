name: Cycle 70 two dependent isolated integrations audit
on:
  push:
    paths:
      - 'benchmarks/cycle70-dependent-pilot-extractions.v1.json'
      - 'benchmarks/cycle70_extraction_audit.py'
      - 'tests/test_cycle70_extraction_audit.py'
      - 'benchmarks/cycle69-isolated-integration-plan.v1.json'
      - 'benchmarks/cycle67-consolidation-inventory.v1.json'
      - 'benchmarks/cycle59_observation_consistency.py'
      - 'benchmarks/cycle61_metrology_context.py'
      - 'docs/CICLO_2026-11-10_EXTRACOES_DEPENDENTES_70.md'
      - '.github/workflows/cycle70-extraction-audit.yml'
  pull_request:
    paths:
      - 'benchmarks/cycle70-dependent-pilot-extractions.v1.json'
      - 'benchmarks/cycle70_extraction_audit.py'
      - 'tests/test_cycle70_extraction_audit.py'
      - 'benchmarks/cycle69-isolated-integration-plan.v1.json'
      - 'benchmarks/cycle67-consolidation-inventory.v1.json'
      - 'benchmarks/cycle59_observation_consistency.py'
      - 'benchmarks/cycle61_metrology_context.py'
      - 'docs/CICLO_2026-11-10_EXTRACOES_DEPENDENTES_70.md'
      - '.github/workflows/cycle70-extraction-audit.yml'
permissions:
  contents: read
jobs:
  synthetic-extraction-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate C70 snapshot topology report (NOT live PR verification)
        run: |
          mkdir -p build/cycle70
          python -m benchmarks.cycle70_extraction_audit --output build/cycle70/dependent-extraction-audit.json
      - name: Run synthetic regression C58-C70
        run: python -m unittest tests.test_cycle58_causal_gate tests.test_cycle59_observation_consistency tests.test_cycle60_metrology tests.test_cycle61_metrology_context tests.test_cycle62_reference_semantics tests.test_cycle63_effectivity tests.test_cycle64_source_governance tests.test_cycle65_review_ledger tests.test_cycle66_study_preregistration tests.test_cycle67_architecture_audit tests.test_cycle68_integration_gate tests.test_cycle69_release_plan tests.test_cycle70_extraction_audit -v
      - name: Publish synthetic snapshot report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cycle70-dependent-extractions-synthetic
          path: build/cycle70/dependent-extraction-audit.json
          if-no-files-found: warn
          retention-days: 14
